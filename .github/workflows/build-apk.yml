name: 构建 APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: ${{ startsWith(github.ref, 'refs/tags/') && '构建 Release' || '构建 Debug' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 构建信息卡里的提交哈希与提交时间由 Gradle 读 git 得到，浅克隆会导致取不到
          fetch-depth: 0

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装编译所需 SDK 组件
        run: |
          sdkmanager --install "platforms;android-37" || sdkmanager --install "platforms;android-37.0" || true
          sdkmanager --install "build-tools;37.0.0" || true

      - name: 缓存 Gradle 依赖
        uses: gradle/actions/setup-gradle@v4

      # 密钥不入库：base64 存在仓库 Secret 里，这里还原成本地文件，
      # 再按项目既有方式写进 local.properties（该文件已被 gitignore）
      # 仓库里没有 local.properties（被 gitignore），CI 上补一份指向 SDK 的
      - name: 准备 local.properties
        run: echo "sdk.dir=$ANDROID_HOME" >> local.properties

      - name: 还原发行签名密钥
        if: startsWith(github.ref, 'refs/tags/')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kiora-release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/kiora-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } >> local.properties

      - name: 构建
        run: |
          chmod +x gradlew
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            ./gradlew :app:assembleRelease
          else
            ./gradlew :app:assembleDebug
          fi

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ startsWith(github.ref, 'refs/tags/') && 'release' || 'debug' }}
          path: app/build/outputs/apk/${{ startsWith(github.ref, 'refs/tags/') && 'release' || 'debug' }}/*.apk

      - name: 发布到 Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true

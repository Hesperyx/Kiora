name: 构建 APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          # 构建信息卡要读 git 哈希/时间，浅克隆取不到
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4

      - name: 构建 APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # API 37 的 platform 包名带次版本号
          yes | sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"

          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew

          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            [ -n "$KEYSTORE_BASE64" ] || { echo "::error::缺少签名相关 Secret"; exit 1; }
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kiora.jks"
            {
              echo "storeFile=$RUNNER_TEMP/kiora.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } >> local.properties
            ./gradlew :app:assembleRelease
          else
            ./gradlew :app:assembleDebug
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ startsWith(github.ref, 'refs/tags/') && 'release' || 'debug' }}
          path: app/build/outputs/apk/**/*.apk

      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
